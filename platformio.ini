; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

lib_deps =
  ; Servo
  madhephaestus/ESP32Servo @ ^0.13.0

  ; OLED display (SSD1306 / SH1106 I2C via U8g2)
  olikraus/U8g2 @ ^2.34.22

  ; Dallas DS18B20 temperature sensors
  paulstoffregen/OneWire @ ^2.3.7
  milesburton/DallasTemperature @ ^3.11.0

  ; WiFi / async web server
  esphome/AsyncTCP-esphome @ ^2.1.4
  esphome/ESPAsyncWebServer-esphome @ ^3.1.0

  ; Home Assistant / MQTT
  knolleary/PubSubClient @ ^2.8

  ; OTA
  ArduinoOTA

  ; Circular log buffer
  rlogiacco/CircularBuffer @ ^1.3.3

  ; JSON (REST API + config files)
  bblanchon/ArduinoJson @ ^6.21.3

build_flags =
  -D MQTT_MAX_PACKET_SIZE=1024
  -D ENABLE_HOMEASSISTANT
  -D ENABLE_OTA
  -D LITTLEFS_SPIFFS_COMPAT
  -D LITTLEFS_CONFIG_FILE="littlefs_config.h"

[env:ota]
extends = env:lolin_s2_mini
upload_protocol = espota
upload_port = 192.168.0.188
; must match OTA_PASSWORD in include/secrets.h
upload_flags =
  --auth=admin
